<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raufu Riliwan Ganiyu</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Background Gradient */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .box {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 40px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2575fc;
            margin-bottom: 20px;
        }

        h1 {
            margin: 10px 0;
            font-size: 28px;
        }

        p.skills {
            margin-bottom: 25px;
            font-size: 16px;
            line-height: 1.5;
        }

        .social-links a {
            display: inline-block;
            margin: 8px;
            padding: 12px 18px;
            text-decoration: none;
            background: #2575fc;
            color: white;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }

        .social-links a i {
            margin-right: 8px;
        }

        .social-links a:hover {
            background: #6a11cb;
            transform: scale(1.05);
        }

        @media (max-width: 500px) {
            .box {
                padding: 30px 20px;
            }
            h1 {
                font-size: 24px;
            }
            p.skills {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <!-- Add your profile picture URL -->
        <img src="https://via.placeholder.com/120" alt="Raufu Riliwan Ganiyu" class="profile-img">
